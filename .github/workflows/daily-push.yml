name: daily-push

on:
  schedule:
    # 23:30 UTC = 07:30 Asia/Shanghai (GitHub cron uses UTC)
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build static daily report
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m causal_ledger cloud \
            --config config/feeds.json \
            --reports reports \
            --base-url "$PAGES_BASE_URL" \
            --days 2 --limit 30 --per-source 2
      - name: Weekly rollup (Monday Beijing)
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "$(TZ=Asia/Shanghai date +%u)" = "1" ] && ls reports/data/*.json >/dev/null 2>&1; then
            python -m causal_ledger cloud --reports reports --weekly-only --no-push \
              --base-url "$PAGES_BASE_URL"
          fi
      - name: Commit report archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "daily report $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - id: deployment
        uses: actions/deploy-pages@v4
